; ============================================================
; Audition Effect Finder — база плагинов
; ============================================================
; Формат:
;   [Имя]              — как показывается в окне поиска
;   aliases = ...      — варианты для поиска, через запятую
;   path = A > B > C   — маршрут в меню (справочно, не используется кодом)
;   downs = 13, 4, 4, 0 — сколько раз нажать ↓ на каждом уровне
;
; КАК ОПРЕДЕЛИТЬ downs:
; 1. Открой Audition, наведи мышь на ▶ нужного слота, кликни — меню открылось.
; 2. Стрелкой ↓ пройди до пункта "VST3", считая нажатия. Это первое число.
; 3. Нажми →, попал в подменю категорий.
; 4. Стрелкой ↓ дойди до "EQ", считая нажатия. Это второе число.
; 5. Нажми →, открылись вендоры.
; 6. ↓ до "FabFilter" — третье число.
; 7. Нажми →, открылись плагины FabFilter.
; 8. ↓ до нужного плагина — четвёртое число.
; 9. Если пункт один в подменю (стрелка ↓ не двигает) — пиши 0.
;
; ВАЖНО: порядок всегда ↓, →, ↓, →, ... В конце — Enter.
; Числа в downs и уровни в path должны совпадать по количеству.
; ============================================================

[Pro-Q 4]
aliases = pro-q 4, pro-q, proq4, proq, eq
path = VST3 > EQ > FabFilter > Pro-Q 4
downs = 13, 6, 0, 0

[Pro-C 2]
aliases = pro-c 2, pro-c, proc2, proc, comp
path = VST3 > Dynamics > FabFilter > Pro-C 2
downs = 13, 5, 4, 0

[Pro-L 2]
aliases = pro-l 2, pro-l, prol2, prol, limiter
path = VST3 > Dynamics > FabFilter > Pro-L 2
downs = 13, 5, 4, 1

[Pro-R 2]
aliases = pro-r 2, pro-r, pror2, pror, reverb
path = VST3 > Reverb > FabFilter > Pro-R 2
downs = 13, 6, 4, 0

[Pro-MB]
aliases = pro-mb, promb, mb, multiband
path = VST3 > Dynamics > FabFilter > Pro-MB
downs = 13, 5, 4, 2

[Pro-DS]
aliases = pro-ds, prods, ds, deesser
path = VST3 > Dynamics > FabFilter > Pro-DS
downs = 13, 5, 4, 3

[Pro-G]
aliases = pro-g, prog, gate
path = VST3 > Dynamics > FabFilter > Pro-G
downs = 13, 5, 4, 4
